version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    ports:
      - "6333:6333"
    environment:
      - QDRANT_API_KEY=qdrant-key
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - PORT=5000
      - LOG_LEVEL=info
    depends_on:
      - qdrant
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - rag-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - rag-network

volumes:
  qdrant_storage:

networks:
  rag-network:
    driver: bridge
