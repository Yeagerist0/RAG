name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Lint backend
        run: |
          if [ -f backend/.eslintrc ] || [ -f backend/.eslintrc.json ] || [ -f backend/.eslintrc.js ] || [ -f backend/.eslintrc.cjs ] || [ -f backend/eslint.config.js ] || [ -f backend/eslint.config.cjs ]; then
            cd backend && npm run lint --if-present
          else
            echo "No backend ESLint configuration found; skipping lint."
          fi
      
      - name: Lint frontend
        run: |
          if [ -f frontend/.eslintrc ] || [ -f frontend/.eslintrc.json ] || [ -f frontend/.eslintrc.js ] || [ -f frontend/.eslintrc.cjs ] || [ -f frontend/eslint.config.js ] || [ -f frontend/eslint.config.cjs ]; then
            cd frontend && npm run lint --if-present
          else
            echo "No frontend ESLint configuration found; skipping lint."
          fi
      
      - name: Build backend
        run: cd backend && npm run build
      
      - name: Build frontend
        run: cd frontend && npm run build

  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Railway
        uses: railway-app/railway-action@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: backend

  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Vercel
        uses: vercel/action@master
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
